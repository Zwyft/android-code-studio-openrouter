name: Build Android Code Studio

on:
  push:
    branches: 
      - "dev"
      - "main" 
      - "indexing"
      - "release/**"
    paths-ignore:
      - '**.md'
      - '**.json'
      - 'fastlane/**'
      - '.github/workflows/crowdin_contributors.yml'
  pull_request:
    branches: [ "dev" ]
    paths-ignore:
      - '**.md'
      - '**.json'
      - 'fastlane/**'
      - '.github/workflows/crowdin_contributors.yml'
  workflow_dispatch: { }

jobs:
  build_release_apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Cancel previous runs
        uses: styfle/cancel-workflow-action@0.12.1
        with:
          access_token: ${{ github.token }}
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'adopt'
      - name: Change Gradle wrapper permissions
        run: chmod +x ./gradlew
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-v2-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Create signing key and local.properties
        run: |
          rm -f signing/signing-key.jks
          keytool -genkeypair -v \
            -keystore signing/signing-key.jks \
            -storetype JKS \
            -alias AndroidCS \
            -storepass android123 \
            -keypass android123 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android, OU=Android, O=Android, L=Mountain View, S=California, C=US"
          echo "signing.storeFile=signing/signing-key.jks" >> local.properties
          echo "signing.storePassword=android123" >> local.properties
          echo "signing.keyAlias=AndroidCS" >> local.properties
          echo "signing.keyPassword=android123" >> local.properties
      - name: Assemble Debug APK
        env:
          SIGNING_STORE_PASSWORD: android123
          SIGNING_KEY_PASSWORD: android123
        run: ./gradlew :core:app:assembleDebug
        # run: ./gradlew :core:app:assembleRelease
      - name: List APK files (debug)
        run: find core/app/build/outputs/apk/debug/ -name "*.apk" 2>/dev/null || echo "No APKs found"
        if: always()
      - name: Upload arm64-v8a Release APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-arm64-v8a-debug
          path: core/app/build/outputs/apk/debug/*arm64-v8a*.apk
        if: always()
      - name: Upload armeabi-v7a Release APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-armeabi-v7a-release
          path: core/app/build/outputs/apk/release/*armeabi-v7a*.apk
        if: always()
      - name: Upload x86_64 Release APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-x86_64-release
          path: core/app/build/outputs/apk/release/*x86_64*.apk
        if: always()
      - name: Upload universal Release APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-universal-release
          path: core/app/build/outputs/apk/release/*universal*.apk
        if: always()